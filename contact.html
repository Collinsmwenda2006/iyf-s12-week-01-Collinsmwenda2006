<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>

<body>
    <header>
        <h1>Contact Us</h1>
        <p>Please fill in the form below to contact us.</p>
    </header>

    <main>
        <form action="#" method="post">

            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" placeholder="Collins Mwenda" value="Collins Mwenda"
                required>
            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="cmwenda497@gmail.com" value="cmwenda497@gmail.com"
                required>
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="0117786418" value="0117786418">
            <br><br>

            <label for="subject">Subject:</label><br>
            <select id="subject" name="subject" required>
                <option value="">Select a subject</option>
                <option value="general">General Inquiry</option>
                <option value="support">Technical Support</option>
                <option value="feedback">Feedback</option>
            </select>
            <br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" placeholder="Write your message here..." minlength="50"
                required>I would like to make an inquiry and learn more about your services. Please provide me with more information. Thank you.</textarea>
            <br><br>

            <input type="checkbox" id="newsletter" name="newsletter" value="yes">
            <label for="newsletter">Subscribe to our newsletter</label>
            <br><br>

            <button type="submit">Submit</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Contact Form</p>
    </footer>

</body>

</html>
